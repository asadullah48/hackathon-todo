apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    app: {{ .Chart.Name }}
    component: backend
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.backend.port }}
    targetPort: {{ .Values.backend.port }}
    protocol: TCP
  selector:
    app: {{ .Chart.Name }}
    component: backend
