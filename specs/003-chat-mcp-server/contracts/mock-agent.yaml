# MockTodoAgent Interface Contract
# Date: 2026-01-03
# Feature: MockTodoAgent Enhancement

openapi: "3.0.3"
info:
  title: MockTodoAgent Interface
  description: |
    Internal interface contract for MockTodoAgent class.
    This is not a REST API but documents the Python class interface.
  version: "1.0.0"

# Class Interface (not REST endpoints)
components:
  schemas:
    # Input Types
    ChatMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [user, assistant, system]
          description: Message sender role
        content:
          type: string
          description: Message content
          maxLength: 10000

    # Output Types
    ToolCallInfo:
      type: object
      required:
        - tool_name
        - arguments
        - result
      properties:
        tool_name:
          type: string
          enum: [add_task, list_tasks, complete_task, delete_task, update_task]
          description: Name of MCP tool invoked
        arguments:
          type: object
          description: Arguments passed to tool
        result:
          type: string
          description: Tool execution result text

    AgentResponse:
      type: object
      required:
        - response
        - tool_calls
      properties:
        response:
          type: string
          description: Human-readable response message
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCallInfo'
          description: List of tools invoked during execution

    # Internal Types
    CommandType:
      type: string
      enum: [add, list, complete, delete, update, unknown]
      description: Detected command type from user message

    ParsedCommand:
      type: object
      required:
        - command_type
        - raw_message
      properties:
        command_type:
          $ref: '#/components/schemas/CommandType'
        task_title:
          type: string
          description: Extracted task title (for add command)
          maxLength: 200
        task_id:
          type: string
          format: uuid
          description: Extracted task UUID (for complete/delete/update)
        status_filter:
          type: string
          enum: [all, pending, completed]
          default: all
          description: Status filter for list command
        new_title:
          type: string
          description: New title for update command
          maxLength: 200
        raw_message:
          type: string
          description: Original user message

# Class Method Signatures
paths:
  /MockTodoAgent.run:
    post:
      operationId: run
      summary: Execute agent with user messages
      description: |
        Main entry point for MockTodoAgent.
        Parses user message, detects command, calls MCP tool, returns response.

        Python signature:
        ```python
        async def run(
            self,
            user_id: str,
            messages: list[dict[str, str]],
            model: str = "gpt-4o-mini",  # ignored in MockAgent
        ) -> tuple[str, list[ToolCallInfo]]
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - messages
              properties:
                user_id:
                  type: string
                  format: uuid
                  description: Authenticated user's UUID
                messages:
                  type: array
                  items:
                    $ref: '#/components/schemas/ChatMessage'
                  description: Conversation history (last message is current)
                model:
                  type: string
                  default: "gpt-4o-mini"
                  description: Model parameter (ignored in MockAgent)
      responses:
        '200':
          description: Agent response with tool calls
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'

  /CommandParser.parse:
    post:
      operationId: parse
      summary: Parse user message into command
      description: |
        Internal method to detect command from natural language.

        Python signature:
        ```python
        def parse(self, message: str) -> ParsedCommand
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  description: User message to parse
      responses:
        '200':
          description: Parsed command result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParsedCommand'

# Command Pattern Examples
x-command-patterns:
  add:
    description: Create a new task
    patterns:
      - "add {title}"
      - "create {title}"
      - "create a task to {title}"
      - "remember to {title}"
      - "need to {title}"
      - "I have to {title}"
    examples:
      - input: "Add buy groceries"
        output:
          command_type: add
          task_title: "buy groceries"
      - input: "Remember to call mom"
        output:
          command_type: add
          task_title: "call mom"

  list:
    description: List tasks with optional filter
    patterns:
      - "show my tasks"
      - "list tasks"
      - "what's pending"
      - "show completed"
    examples:
      - input: "Show my tasks"
        output:
          command_type: list
          status_filter: all
      - input: "What's pending?"
        output:
          command_type: list
          status_filter: pending

  complete:
    description: Mark task as complete
    patterns:
      - "complete task {uuid}"
      - "mark {uuid} as done"
      - "finish task {uuid}"
    examples:
      - input: "Complete task abc12345-1234-1234-1234-123456789012"
        output:
          command_type: complete
          task_id: "abc12345-1234-1234-1234-123456789012"

  delete:
    description: Delete a task
    patterns:
      - "delete task {uuid}"
      - "remove {uuid}"
    examples:
      - input: "Delete task abc12345-1234-1234-1234-123456789012"
        output:
          command_type: delete
          task_id: "abc12345-1234-1234-1234-123456789012"

  update:
    description: Update task title
    patterns:
      - "update {uuid} to {new_title}"
      - "change task {uuid} title to {new_title}"
    examples:
      - input: "Update abc12345-1234-1234-1234-123456789012 to 'Buy groceries and fruits'"
        output:
          command_type: update
          task_id: "abc12345-1234-1234-1234-123456789012"
          new_title: "Buy groceries and fruits"
